<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurant Premium — El Antigravedad</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --border-radius: 12px;
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 24px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            background: white;
            border: 1px solid #e2e8f0;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #btnMostrar {
            background: var(--primary);
            color: white;
            border: none;
        }

        .menu-list {
            list-style: none;
            padding: 0;
        }

        .menu-list li {
            padding: 15px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f1f5f9;
        }

        .normal {
            border-left: 5px solid #cbd5e1;
        }

        .bajo {
            border-left: 5px solid var(--warning);
            color: var(--warning);
            font-weight: 600;
        }

        .agotado {
            border-left: 5px solid var(--danger);
            color: var(--danger);
            font-weight: 600;
            opacity: 0.6;
        }

        #output {
            margin-top: 20px;
        }

        /* Alertas Premium */
        .status-box {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .procesando {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            font-style: italic;
        }

        .exito {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .error-red {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .error-validacion {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍴 El Antigravedad</h1>

        <div class="btn-group">
            <button id="btnMostrar">Ver Menú Completo</button>
            <button id="btnAgregar">Nuevo Plato Demo</button>
            <button id="btnStockBajo">Crisis de Stock</button>
            <button id="btnResumen">Generar Resumen</button>
        </div>

        <div class="btn-group">
            <input id="inputBuscar" style="padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; flex-grow: 1;"
                placeholder="Buscar plato..." />
            <button id="btnBuscar">Buscar</button>
        </div>

        <div id="output"></div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
