<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurante — Día 8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .normal {
            color: black;
        }

        .bajo {
            color: orange;
            font-weight: bold;
        }

        .agotado {
            color: red;
            font-weight: bold;
        }

        .mensaje-exito {
            color: green;
            font-weight: bold;
        }

        .mensaje-negocio {
            color: orange;
            font-weight: bold;
        }

        .mensaje-sistema {
            color: red;
            font-weight: bold;
        }

        .mensaje-proceso {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Menú del Restaurante</h1>

    <button id="btnMostrar">Mostrar menú</button>
    <button id="btnAgregar">Agregar plato demo</button>

    <hr>
    <h2>Herramientas</h2>

    <input id="inputBuscar" placeholder="Buscar plato por nombre" />
    <button id="btnBuscar">Buscar</button>

    <button id="btnStockBajo">Ver stock bajo (&lt;= 3)</button>
    <button id="btnResumen">Ver resumen</button>

    <hr>
    <h2>Vender plato</h2>

    <input id="inputVenderNombre" placeholder="Nombre del plato" />
    <input id="inputVenderCantidad" placeholder="Cantidad" type="number" />
    <button id="btnVender">Vender</button>

    <div id="output"></div>

    <script type="module" src="./main.js"></script>
</body>

</html>
